bootstrap.Page:
  cdn: true
  theme: Cerulean
  name: Application Page Template
  language: EN
  stylesheets: 
    - https://cdn.jsdelivr.net/gh/Nasdanika-Models/html-app@master/gen/web-resources/css/app.css 
    - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css
    - https://cdn.jsdelivr.net/npm/jstree@3.3.11/dist/themes/default/style.min.css
    - https://cdn.jsdelivr.net/npm/github-markdown-css@5.7.0/github-markdown.min.css
    - https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/default.min.css
    - https://cdn.jsdelivr.net/npm/bootstrap-vue@2.23.0/dist/bootstrap-vue.css
  scripts:
    - https://cdn.jsdelivr.net/gh/Nasdanika-Models/html-app@master/gen/web-resources/js/common.js 
    - https://cdn.jsdelivr.net/gh/Nasdanika-Models/html-app@master/gen/web-resources/js/dark-head.js 
    - https://cdn.jsdelivr.net/npm/jstree@3.3.11/dist/jstree.min.js
    - https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js
    - https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js
    - https://cdn.jsdelivr.net/npm/bootstrap-vue@2.23.0/dist/bootstrap-vue.min.js
    - https://cdn.jsdelivr.net/gh/Nasdanika-Models/html-app@master/gen/web-resources/js/components/table.js
    - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js
    - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/groovy.min.js
  head:
    # Google analytics
    content.Text: |+2    
      <!-- Global site tag (gtag.js) - Google Analytics -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-9BRJVLK8CC"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
      
        gtag('config', 'G-9BRJVLK8CC');
      </script>   
      
      <!-- ${search-config} -->
 
      <style>
        :root {
          --nsd-blue: #2c5aa0;      /* model/core */
          --nsd-slate: #64748B;     /* humans */
          --nsd-amber: #D79B00;     /* agents */
          --nsd-green: #4C9A61;     /* systems */
        }
        /* Match the docs.nasdanika.org header: replace with the exact hex from the docs site CSS. */
        .navbar-nsd { background: #1e3f70; }
        .navbar-nsd .navbar-brand img { height: 28px; margin-right: 0.5rem; }
        /* Bend Cerulean toward the brand blue so the page has one blue, not two. */
        .btn-primary, .btn-primary:hover, .btn-primary:focus { background-color: #2c5aa0; border-color: #2c5aa0; }
        .btn-outline-primary { color: #2c5aa0; border-color: #2c5aa0; }
        .btn-outline-primary:hover, .btn-outline-primary.active { background-color: #2c5aa0 !important; border-color: #2c5aa0 !important; }
        .hero { padding: 4.5rem 0 3rem 0; }
        .hero h1 { font-weight: 700; letter-spacing: -0.5px; }
        .hero .lead { max-width: 46rem; margin: 1.25rem auto 0 auto; }
        .cta-note { color: #6c757d; font-size: 0.95rem; }
        .persona-chip { font-size: 0.85rem; font-weight: 500; margin: 0 0.2rem; }
        .section { padding: 3.5rem 0; }
        .section-alt { background: #f5f7f9; }
        .section h2 { font-weight: 700; margin-bottom: 1.5rem; }
        .prose { max-width: 44rem; margin: 0 auto; font-size: 1.06rem; }
        .prose p + p { margin-top: 1rem; }
        .subblock h5 { font-weight: 700; margin-top: 2rem; }
        .badge-line { font-size: 0.85rem; color: #6c757d; }
        .diagram-caption { color: #6c757d; font-size: 0.9rem; }
        .arc-icon { height: 1.1em; vertical-align: -0.15em; }
        .tower-placeholder {
          border: 2px dashed #ced4da; border-radius: 0.5rem;
          padding: 3rem 1rem; color: #6c757d; background: #fff;
        }
        .level-card h5 { font-weight: 700; }
        footer { padding: 2.5rem 0; font-size: 0.9rem; }
        .arc-label { font-size: 13px; font-weight: 600; }
      </style>
       
  body:
    app.Page:
      fluid: false
